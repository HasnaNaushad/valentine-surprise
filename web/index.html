<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Valentine Surprise 💘</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
<!-- FX Canvas (hearts shower after YES) -->
<canvas id="fxCanvas" style="position:fixed; inset:0; pointer-events:none; z-index:0;"></canvas>

<div class="card">
    <div class="badge">💖 For My Valentine 💖</div>

    <!-- ===== Screen 1 ===== -->
    <div id="questionArea">
        <h1>Will you be my Valentine, <span class="name">Shebi</span>? 💘</h1>
        <p class="sub">Choose wisely 😄</p>

        <div class="btn-row">
            <button id="yesBtn" class="btn yes">Yes 💌</button>
            <button id="noBtn" class="btn no">No 😢</button>
        </div>
    </div>

    <!-- ===== Screen 2 ===== -->
    <div id="yesScreen" class="hidden">
        <div id="yesMessage" class="yes-message">
            HAHA 😄💘 You'll always be stuck with me! 🌹
        </div>

        <button id="nextBtn" class="btn next">Let’s go to the next surprise ✨</button>
    </div>

    <!-- ===== Screen 3 ===== -->
    <div id="galleryScreen" class="hidden">
        <h2 class="galleryTitle">Our Moments 💞</h2>

        <div class="polaroidStack" id="polaroidStack">
            <!-- Placeholder polaroids (we will replace with your portraits later) -->
            <div class="polaroid active">
                <div class="photo placeholder">Photo 1</div>
                <div class="caption">💖</div>
            </div>

            <div class="polaroid">
                <div class="photo placeholder">Photo 2</div>
                <div class="caption">💘</div>
            </div>

            <div class="polaroid">
                <div class="photo placeholder">Photo 3</div>
                <div class="caption">🌹</div>
            </div>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
